name: "LIFX Switch Bridge"
version: "0.1.2"
slug: "lifx_switch_bridge"
description: "Exposes LIFX Switch relays and backlights to Home Assistant via Photons Interactor + MQTT."
url: "https://github.com/m7les/hassio-addons/tree/main/lifx_switch_bridge"
# Uncomment after pushing pre-built images to GHCR (see .github/workflows/build.yml):
# image: "ghcr.io/m7les/hassio-addons/{arch}-lifx_switch_bridge"
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: services
boot: auto
homeassistant_api: false
hassio_api: false
host_network: true
services:
  - mqtt:need
options:
  interactor_url: "http://127.0.0.1:6100"
  poll_interval: 5
  backlight_poll_interval: 30
  log_level: "info"
schema:
  interactor_url: str
  poll_interval: int(1,60)
  backlight_poll_interval: int(5,600)
  log_level: list(debug|info|warning|error)
