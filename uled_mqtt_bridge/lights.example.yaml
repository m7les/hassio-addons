lights:
  - id: uled_1
    name: "ULED 1"
    ip: "192.168.1.XXX"   # Replace with actual light IP
  - id: uled_2
    name: "ULED 2"
    ip: "192.168.1.XXX"   # Replace with actual light IPs

# Local MQTT broker that Home Assistant connects to
mqtt:
  host: "localhost"
  port: 1883

# How often to poll device status (seconds)
poll_interval: 30

# HA MQTT discovery prefix
discovery_prefix: "homeassistant"
